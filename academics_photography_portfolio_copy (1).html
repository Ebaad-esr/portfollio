or:var(--ink);white-space:nowrap}.hero-name:after{content:\".\";color:var(--accent)}\n@media(max-width:850px){.hero-layout{grid-template-columns:1fr;gap:30px}.hero-portrait{width:min(82%,380px);justify-self:center}.hero-portrait img{height:460px}.hero{padding:80px 0 65px}}\n@media(max-width:560px){.brand{font-size:21px}.hero-portrait{width:min(88%,340px)}.hero-portrait img{height:390px}.hero-name{font-size:clamp(34px,9vw,48px)}}\n\n<\/style><\/head><body>\n<header><div class=\"wrap nav\"><a class=\"brand\" href=\"academics.html\">EBAAD<b>.<\/b>REHMAN<\/a><nav class=\"navlinks\"><a class=\"active\" href=\"academics.html\">Academics<\/a><a href=\"photography.html\">Photography<\/a><\/nav><div class=\"extra-tools\">\n      <input class=\"searchbox\" id=\"siteSearch\" type=\"search\" placeholder=\"Search this page…\" aria-label=\"Search this page\">\n      <div class=\"tools\"><button class=\"icon\" id=\"theme\" aria-label=\"Toggle light and dark theme\" title=\"Toggle light/dark\">◐<\/button>\n      <button class=\"icon menu-toggle\" id=\"menuToggle\" aria-label=\"Open navigation menu\" aria-expanded=\"false\">☰<\/button><\/div>\n    <\/div>\n    <nav class=\"menu-panel\" id=\"menuPanel\" aria-label=\"Quick navigation\">\n      <a href=\"academics.html\">Academics & engineering<\/a><a href=\"photography.html\">Photography<\/a>\n      <a href=\"#about\">About<\/a><a href=\"#interactive\">Explore more<\/a><a href=\"#comments\">Comments<\/a>\n    <\/nav><\/div><\/header>\n<main>\n<div class=\"hero\"><div class=\"wrap hero-layout\"><div class=\"hero-inner\"><div class=\"eyebrow reveal\">Ebaad Rehman · Electronics · Embedded systems · Software<\/div><h1 class=\"reveal\">Engineering<br>with <span>intent.<\/span><\/h1><p class=\"intro reveal\">I’m Ebaad Rehman, a third-year Electronics &amp; Telecommunication Engineering student at SSGMCE, Shegaon. I work across embedded systems, microcontrollers, electronics and software development — turning curiosity into practical builds.<\/p><div class=\"buttons reveal\"><a class=\"btn primary\" href=\"#projects\">Explore my work ↘<\/a><a class=\"btn\" href=\"photography.html\">View photography ↗<\/a><a class=\"btn\" href=\"https://github.com/Ebaad-esr\" target=\"_blank\" rel=\"noopener\">GitHub ↗<\/a><\/div><div class=\"scroll reveal\">Scroll to explore<\/div><\/div><div class=\"hero-portrait\"><img src=\"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1100&q=90\" alt=\"Temporary portrait placeholder — replace with Ebaad’s photo\"><h2 class=\"hero-name\">EBAAD REHMAN<\/h2><\/div><\/div><\/div>\n<section id=\"about\"><div class=\"wrap\"><div class=\"sectionhead reveal\"><div class=\"num\">01 / ABOUT<\/div><div><h2>Curiosity becomes<br>something tangible.<\/h2><p>A practical-minded engineering student interested in how systems work — from a circuit on a bench to the software that brings it to life.<\/p><\/div><\/div><div class=\"about\"><article class=\"panel reveal\"><p>My work centres on embedded electronics, microcontroller-based systems, sensor interfacing, wireless communication and software. I enjoy taking an idea through experimentation and debugging, then refining it into a working build. Photography gives me another way to observe detail, light and composition.<\/p><\/article><div class=\"facts reveal\"><div class=\"fact\"><small>Degree<\/small><strong>B.E. · ENTC<\/strong><\/div><div class=\"fact\"><small>Institution<\/small><strong>SSGMCE<\/strong><\/div><div class=\"fact\"><small>Current year<\/small><strong>Third year<\/strong><\/div><div class=\"fact\"><small>Based in<\/small><strong>Shegaon, India<\/strong><\/div><\/div><\/div><\/div><\/section>\n<section id=\"projects\"><div class=\"wrap\"><div class=\"sectionhead reveal\"><div class=\"num\">02 / SELECTED WORK<\/div><div><h2>Hardware meets<br>software.<\/h2><p>Academic and personal builds across embedded systems, wireless electronics, signal processing and web development.<\/p><\/div><\/div><div class=\"projects\">\n<article class=\"project reveal\"><div class=\"projecttop\"><span class=\"tag\">Web application<\/span><span class=\"num\">P — 01<\/span><\/div><h3>QuizCraft<\/h3><p>A web-based quiz application developed as a software project and deployed on Railway, with a public application and source repository.<\/p><div class=\"chips\"><span>Web development<\/span><span>JavaScript<\/span><span>Deployment<\/span><\/div><a class=\"plink\" href=\"https://quiz-craft.up.railway.app\" target=\"_blank\" rel=\"noopener\">Open live application ↗<\/a><a class=\"plink\" href=\"https://github.com/Ebaad-esr/QuizCraft\" target=\"_blank\" rel=\"noopener\">Source code ↗<\/a><\/article>\n<article class=\"project reveal\"><div class=\"projecttop\"><span class=\"tag\">Embedded audio<\/span><span class=\"num\">P — 02<\/span><\/div><h3>ESP32 Bluetooth Audio Player<\/h3><p>An SD-card audio player using ESP32 to read MP3 files, decode audio and stream to Bluetooth earbuds through A2DP. Work includes decoder stability, buffering and sample-rate handling.<\/p><div class=\"chips\"><span>ESP32<\/span><span>C++<\/span><span>microSD<\/span><span>MP3<\/span><span>A2DP<\/span><\/div><\/article>\n<article class=\"project reveal\"><div class=\"projecttop\"><span class=\"tag\">DSP · Sensor interface<\/span><span class=\"num\">P — 03<\/span><\/div><h3>MAX30102 Signal Processing<\/h3><p>An academic DSP project using the MAX30102 optical sensor with ESP32. Sensor data is processed on the microcontroller and displayed through an offline web interface with a timed measurement flow.<\/p><div class=\"chips\"><span>ESP32<\/span><span>MAX30102<\/span><span>DSP<\/span><span>I²C<\/span><\/div><\/article>\n<article class=\"project reveal\"><div class=\"projecttop\"><span class=\"tag\">Wireless electronics<\/span><span class=\"num\">P — 04<\/span><\/div><h3>8-Channel Wireless Controller<\/h3><p>A multi-channel wireless control project built around Arduino Nano boards and nRF24L01 radio modules, exploring transmitter–receiver communication and control signals.<\/p><div class=\"chips\"><span>Arduino Nano<\/span><span>nRF24L01<\/span><span>RF<\/span><span>C++<\/span><\/div><\/article>\n<article class=\"project reveal\"><div class=\"projecttop\"><span class=\"tag\">Electronics design<\/span><span class=\"num\">P — 05<\/span><\/div><h3>PCB &amp; Circuit Design<\/h3><p>Practical exploration of circuit design, component selection, schematic capture and PCB layout workflows, including single-sided board planning.<\/p><div class=\"chips\"><span>KiCad<\/span><span>Schematic design<\/span><span>PCB layout<\/span><\/div><\/article>\n<article class=\"project reveal\"><div class=\"projecttop\"><span class=\"tag\">Prototyping<\/span><span class=\"num\">P — 06<\/span><\/div><h3>Microcontroller Experiments<\/h3><p>Hands-on work with ESP32, ESP8266 and Arduino platforms: sensor interfacing, I²C/SPI communication, displays, wireless modules and hardware debugging.<\/p><div class=\"chips\"><span>ESP32<\/span><span>ESP8266<\/span><span>Arduino<\/span><span>I²C / SPI<\/span><\/div><\/article>\n<\/div><\/div><\/section>\n<section id=\"leadership\"><div class=\"wrap\"><div class=\"sectionhead reveal\"><div class=\"num\">03 / LEADERSHIP<\/div><div><h2>Building with<br>people, too.<\/h2><p>Technical leadership and event-team involvement at SSGMCE.<\/p><\/div><\/div><div class=\"leaders\"><article class=\"leader reveal\"><div class=\"tag\">Technical leadership<\/div><h3>Technical Head<br>ISTE SSGMCE<\/h3><p>Student chapter leadership.<\/p><\/article><article class=\"leader reveal\"><div class=\"tag\">Technical leadership<\/div><h3>Technical Head<br>Mozilla SSGMCE<\/h3><p>Campus technical community.<\/p><\/article><article class=\"leader reveal\"><div class=\"tag\">Event team<\/div><h3>Innovo SSGMCE<br>2K25<\/h3><p>Technical team member.<\/p><\/article><article class=\"leader reveal\"><div class=\"tag\">Event team<\/div><h3>Navonmesh SSGMCE<br>2026<\/h3><p>Technical team member.<\/p><\/article><\/div><\/div><\/section>\n<section id=\"skills\"><div class=\"wrap\"><div class=\"sectionhead reveal\"><div class=\"num\">04 / TOOLKIT<\/div><div><h2>Tools of the trade.<\/h2><p>Technologies and tools used across coursework, experiments and personal projects.<\/p><\/div><\/div><div class=\"skills\"><article class=\"skill reveal\"><h3>Programming<\/h3><div class=\"chips\"><span>C / C++<\/span><span>Python<\/span><span>JavaScript<\/span><span>HTML / CSS<\/span><\/div><\/article><article class=\"skill reveal\"><h3>Hardware<\/h3><div class=\"chips\"><span>ESP32<\/span><span>ESP8266<\/span><span>Arduino<\/span><span>nRF24L01<\/span><span>I²C<\/span><span>SPI<\/span><span>Sensors<\/span><span>PCB basics<\/span><\/div><\/article><article class=\"skill reveal\"><h3>Tools &amp; workflow<\/h3><div class=\"chips\"><span>Git / GitHub<\/span><span>VS Code<\/span><span>Arduino IDE<\/span><span>KiCad<\/span><span>Ubuntu<\/span><span>Lightroom<\/span><\/div><\/article><\/div><\/div><\/section>\n<section id=\"education\"><div class=\"wrap\"><div class=\"sectionhead reveal\"><div class=\"num\">05 / EDUCATION<\/div><div><h2>Learning by<br>building.<\/h2><p>Current academic background.<\/p><\/div><\/div><div class=\"education reveal\"><div class=\"eyebrow\">Current studies<\/div><h3>Bachelor of Engineering — Electronics &amp; Telecommunication<\/h3><p>Shri Sant Gajanan Maharaj College of Engineering (SSGMCE), Shegaon · Third year<\/p><p style=\"margin-top:15px;color:var(--muted)\">CGPA, semester-wise grades and verified certificates can be added when exact details are available.<\/p><\/div><\/div><\/section>\n<section><div class=\"wrap\"><div class=\"contact reveal\"><div><div class=\"eyebrow\">Continue exploring<\/div><h2>Engineering is one side.<br>Photography is the other.<\/h2><p>Visit the separate photography portfolio for selected frames and visual work.<\/p><\/div><a class=\"btn\" href=\"photography.html\">Enter photography ↗<\/a><\/div><\/div><\/section>\n\n<section class=\"feature-band\" id=\"interactive\"><div class=\"wrap\">\n  <div class=\"sectionhead\"><div class=\"num\">06 / EXTRA<\/div><div><h2>Beyond the circuit.<\/h2><p>A few more details about the person behind the projects—creative interests alongside the engineering work.<\/p><\/div><\/div>\n  <div class=\"feature-grid\">\n    <article class=\"feature-card\"><span class=\"glyph\">⌁<\/span><h3>Two-wheel perspective<\/h3><p>I enjoy motovlogging and developing ride-focused content under the EBAAD RIDES identity.<\/p><\/article>\n    <article class=\"feature-card\"><span class=\"glyph\">◎<\/span><h3>Visual storytelling<\/h3><p>Photography is a creative outlet: observing light, colour, framing and small details.<\/p><\/article>\n    <article class=\"feature-card\"><span class=\"glyph\">⌘<\/span><h3>Build, test, repeat<\/h3><p>From Arduino and ESP32 prototypes to PCB layouts, I like learning by making and debugging.<\/p><\/article>\n  <\/div>\n  <div class=\"tabbar\" role=\"tablist\" aria-label=\"More about Ebaad\">\n    <button role=\"tab\" aria-selected=\"true\" data-tab=\"tab-engineering\">Engineering<\/button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"tab-creative\">Creative side<\/button>\n    <button role=\"tab\" aria-selected=\"false\" data-tab=\"tab-community\">Community<\/button>\n  <\/div>\n  <div class=\"tab-panel\" id=\"tab-engineering\" role=\"tabpanel\">Interested in embedded systems, microcontrollers, wireless communication, audio electronics, sensor interfacing and practical PCB design.<\/div>\n  <div class=\"tab-panel\" id=\"tab-creative\" role=\"tabpanel\" hidden>Interested in photography, motovlogging, visual design and presenting technical ideas clearly.<\/div>\n  <div class=\"tab-panel\" id=\"tab-community\" role=\"tabpanel\" hidden>Have contributed to technical teams and student activities at SSGMCE, including Innovo and Navonmesh, and technical leadership in ISTE and Mozilla student communities.<\/div>\n  <div class=\"sectionhead\" style=\"margin-top:52px\"><div class=\"num\">QUICK FAQ<\/div><div><h2>Small details.<\/h2><p>Expandable notes about my interests and working style.<\/p><\/div><\/div>\n  <div class=\"accordion\">\n    <details><summary>What kind of projects do I enjoy?<\/summary><p>Hands-on electronics projects that combine hardware, firmware and a useful interface—especially ESP32, Arduino, sensors, wireless links and audio.<\/p><\/details>\n    <details><summary>What tools have I explored?<\/summary><p>Arduino IDE, KiCad, C/C++, Python, JavaScript and web technologies, along with practical debugging using serial output and test circuits.<\/p><\/details>\n    <details><summary>What do I enjoy outside coursework?<\/summary><p>Photography, motorcycle content, creative design and helping organise student technical events.<\/p><\/details>\n  <\/div>\n  <div class=\"sectionhead\" style=\"margin-top:52px\"><div class=\"num\">LINKS<\/div><div><h2>Find my work.<\/h2><p>Useful starting points and project links.<\/p>\n    <ul style=\"padding-left:20px;color:var(--muted);font-size:16px;line-height:2.2\">\n      <li><a href=\"https://github.com/Ebaad-esr\" target=\"_blank\" rel=\"noreferrer\">↗ GitHub profile<\/a><\/li>\n      <li><a href=\"https://github.com/Ebaad-esr/QuizCraft\" target=\"_blank\" rel=\"noreferrer\">↗ QuizCraft repository<\/a><\/li>\n      <li><a href=\"https://quiz-craft.up.railway.app\" target=\"_blank\" rel=\"noreferrer\">↗ QuizCraft live demo<\/a><\/li>\n    <\/ul>\n  <\/div><\/div>\n  <div class=\"sectionhead\" style=\"margin-top:52px\"><div class=\"num\">COMMENTS<\/div><div><h2>Leave a note.<\/h2><p>Comments are saved only in this browser on this device. They are not sent to a server.<\/p>\n    <div id=\"comments\"><form class=\"comment-form\" id=\"commentForm\"><input id=\"commentName\" maxlength=\"40\" placeholder=\"Your name\" aria-label=\"Your name\" required><input id=\"commentTopic\" maxlength=\"60\" placeholder=\"Topic (optional)\" aria-label=\"Topic\"><textarea id=\"co ver.unobserve(entry.target)}\n  }),{threshold:.12,rootMargin:'0px 0px -5% 0px'});\n  motionTargets.forEach(el=>motionObserver.observe(el));\n}\n\n<\/script>\n<script>\n(function () {\n  function sendHeight() {\n    const root = document.documentElement;\n    const body = document.body;\n    const height = Math.max(\n      root ? root.scrollHeight : 0,\n      body ? body.scrollHeight : 0\n    );\n    parent.postMessage({ type: 'portfolio-resize', height: Math.ceil(height) }, '*');\n  }\n  window.addEventListener('load', function () {\n    sendHeight();\n    setTimeout(sendHeight, 250);\n    setTimeout(sendHeight, 900);\n  });\n  window.addEventListener('resize', sendHeight);\n  if ('ResizeObserver' in window) {\n    const observer = new ResizeObserver(() => requestAnimationFrame(sendHeight));\n    observer.observe(document.documentElement);\n    observer.observe(document.body);\n  }\n  document.fonts && document.fonts.ready.then(sendHeight);\n  document.addEventListener('click', function (event) {\n    const link = event.target.closest('a[href]');\n    if (!link || event.defaultPrevented || event.button !== 0 ||\n        event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;\n    const href = link.getAttribute('href') || '';\n    let destination;\n    try { destination = new URL(href, 'https://portfolio.local/'); } catch (_) { return; }\n    const file = destination.pathname.split('/').pop().toLowerCase();\n    const targetPage = file === 'academics.html' ? 'academics' :\n                       file === 'photography.html' ? 'photography' : null;\n    if (!targetPage) return;\n    event.preventDefault();\n    parent.postMessage({\n      type: 'portfolio-page',\n      page: targetPage,\n      hash: destination.hash || ''\n    }, '*');\n  });\n})();\n<\/script>\n\n<\/body><\/html>",

ef=\"#about\">About<\/a><a href=\"#interactive\">Explore more<\/a><a href=\"#comments\">Comments<\/a>\n    <\/nav><\/div><\/header>\n<main>\n<section class=\"hero\" id=\"about\"><div class=\"hero-copy\"><div class=\"eyebrow reveal\">Photography · Personal collection<\/div><h1 class=\"reveal\">Look closer.<br><span style=\"color:var(--accent)\">Feel more.<\/span><\/h1><p class=\"reveal\">A visual journal by Ebaad Rehman. Frames shaped by light, colour, texture and the small details that make ordinary moments worth remembering.<\/p><div class=\"actions reveal\"><a class=\"btn primary\" href=\"#gallery\">Explore the gallery ↓<\/a><a class=\"btn\" href=\"academics.html\">Engineering portfolio ↗<\/a><\/div><\/div><div class=\"hero-visual\"><div class=\"visual-placeholder\"><span>Featured photograph<br>add your hero image<\/span><\/div><\/div><\/section>\n<div class=\"wrap\"><div class=\"introbar reveal\"><div class=\"eyebrow\">The approach<\/div><p>Photography is the creative counterpart to engineering: observe carefully, experiment with perspective, and pay attention to details that might otherwise pass unnoticed. This space is dedicated to selected photographs and visual experiments.<\/p><\/div><\/div>\n<section class=\"gallery-section\" id=\"gallery\"><div class=\"wrap\"><div class=\"gallery-head reveal\"><div><div class=\"eyebrow\">Selected frames · 01—22<\/div><h2>Collected moments.<\/h2><\/div><div><p>Add up to 22 photographs to preview your gallery. The selected images stay in this browser session only.<\/p><label class=\"btn upload\">Add photographs <input id=\"photos\" type=\"file\" accept=\"image/*\" multiple hidden><\/label><\/div><\/div><div class=\"gallery\" id=\"galleryGrid\"><\/div><p class=\"note\">To publish your photographs, place the image files in your website folder and connect their file paths in the gallery code.<\/p><\/div><\/section>\n<section class=\"statement\"><div class=\"wrap reveal\"><blockquote>“The best frames often come from <span>slowing down<\/span> long enough to notice.”<\/blockquote><\/div><\/section>\n<section class=\"contact\"><div class=\"wrap\" style=\"display:flex;justify-content:space-between;align-items:center;gap:30px\"><div><div class=\"eyebrow\">Two sides, one perspective<\/div><h2>Back to the build bench?<\/h2><p>Explore my engineering work, projects and technical experience.<\/p><\/div><a class=\"btn\" href=\"academics.html\">Go to academics ↗<\/a><\/div><\/section>\n\n<section class=\"feature-band\" id=\"interactive\"><div class=\"wrap\">\n  <div class=\"sectionhead\"><div class=\"num\">02 / EXPLORE<\/div><div><h2>More than a gallery.<\/h2><p>A few interactive ways to explore the creative side of this portfolio.<\/p><\/div><\/div>\n  <div class=\"feature-grid\">\n    <article class=\"feature-card\"><span class=\"glyph\">◉<\/span><h3>Observe<\/h3><p>Look for interesting light, colour, geometry and overlooked details.<\/p><\/article>\n    <article class=\"feature-card\"><span class=\"glyph\">⌖<\/span><h3>Experiment<\/h3><p>Try a different angle, crop or perspective before settling on a frame.<\/p><\/article>\n    <article class=\"feature-card\"><span class=\"glyph\">✳<\/span><h3>Collect<\/h3><p>Build a visual journal of moments, places and personal projects.<\/p><\/article>\n  <\/div>\n  <div class=\"sectionhead\" style=\"margin-top:48px\"><div class=\"num\">CAROUSEL<\/div><div><h2>What I look for.<\/h2><p>Use the arrows to move through a few photography themes.<\/p>\n    <div class=\"carousel\"><button id=\"carouselPrev\" aria-label=\"Previous slide\">←<\/button><article class=\"carousel-card\" aria-live=\"polite\"><div class=\"eyebrow\" id=\"slideCount\">01 / 04<\/div><h3 id=\"slideTitle\">Light & shadow<\/h3><p id=\"slideText\">How contrast and direction of light change the feeling of a frame.<\/p><\/article><button id=\"carouselNext\" aria-label=\"Next slide\">→<\/button><\/div>\n  <\/div><\/div>\n  <div class=\"sectionhead\" style=\"margin-top:48px\"><div class=\"num\">QUICK FAQ<\/div><div><h2>Behind the lens.<\/h2><p>Expandable notes about this visual journal.<\/p>\n    <div class=\"accordion\"><details><summary>What belongs in this gallery?<\/summary><p>Personal photographs and visual experiments. Replace the sample frames with your own images using the Add photographs control above.<\/p><\/details><details><summary>Can I use this on my phone?<\/summary><p>Yes. The navigation collapses into a hamburger menu and the gallery rearranges for smaller screens.<\/p><\/details><\/div>\n  <\/div><\/div>\n  <div class=\"sectionhead\" style=\"margin-top:48px\"><div class=\"num\">COMMENTS<\/div><div><h2>Share a thought.<\/h2><p>Comments are stored locally in this browser only; there is no backend or public comment feed.<\/p>\n    <div id=\"comments\"><form class=\"comment-form\" id=\"commentForm\"><input id=\"commentName\" maxlength=\"40\" placeholder=\"Your name\" aria-label=\"Your name\" required><input id=\"commentTopic\" maxlength=\"60\" placeholder=\"Topic (optional)\" aria-label=\"Topic\"><textarea id=\"commentText\" maxlength=\"500\" placeholder=\"Write a comment…\" aria-label=\"Comment\" required><\/textarea><button class=\"btn primary\" type=\"submit\">Post comment ↗<\/button><\/form><div class=\"comment-list\" id=\"commentList\" aria-live=\"polite\"><\/div><\/div>\n  <\/div><\/div>\n<\/div><\/section>\n\n<\/main><footer class=\"site-footer\">\n  <div class=\"site-footer-inner wrap\">\n    <div class=\"footer-top\">\n      <section class=\"footer-card footer-brand-card\" aria-label=\"About Ebaad\">\n        <p class=\"footer-brand\">EBAAD<b>.<\/b><\/p>\n        <p class=\"footer-description\">A personal visual journal for photography, creative experiments, light, colour and everyday details.<\/p>\n        <a class=\"footer-card-cta\" href=\"https://github.com/Ebaad-esr\" target=\"_blank\" rel=\"noopener noreferrer\">Visit GitHub profile <span aria-hidden=\"true\">↗<\/span><\/a>\n      <\/section>\n      <section class=\"footer-card\" aria- img\"><img id=\"viewImg\" alt=\"Selected photograph\"><\/div><\/div>\n<script>\n(()=>{const root=document.documentElement,theme=document.getElementById('theme'),saved=localStorage.getItem('ebaad-theme-v2');if(saved)root.dataset.theme=saved;theme.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('ebaad-theme-v2',root.dataset.theme)});document.getElementById('year').textContent=new Date().getFullYear();const reveal=document.querySelectorAll('.reveal');if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&'IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});reveal.forEach(e=>io.observe(e))}else reveal.forEach(e=>e.classList.add('visible'));\nconst arr=new Array(22).fill(null),grid=document.getElementById('galleryGrid'),input=document.getElementById('photos'),viewer=document.getElementById('viewer'),img=document.getElementById('viewImg'),count=document.getElementById('count');let cur=0;\nfunction draw(){grid.innerHTML='';arr.forEach((src,i)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label',src?`View photograph ${i+1}`:`Photograph placeholder ${i+1}`);if(src){const im=document.createElement('img');im.src=src;im.alt=`Photograph ${i+1}`;b.appendChild(im)}else{const ph=document.createElement('span');ph.className='placeholder';ph.textContent=`Frame ${String(i+1).padStart(2,'0')}`;b.appendChild(ph)}const lab=document.createElement('span');lab.className='tilelabel';lab.textContent=`FRAME ${String(i+1).padStart(2,'0')}`;b.appendChild(lab);b.addEventListener('click',()=>{if(src)open(i)});grid.appendChild(b)})}\nfunction update(){img.src=arr[cur];count.textContent=`${String(cur+1).padStart(2,'0')} / 22`}function open(i){cur=i;update();viewer.classList.add('open');document.body.style.overflow='hidden'}function close(){viewer.classList.remove('open');document.body.style.overflow=''}function step(d){for(let n=0;n<22;n++){cur=(cur+d+22)%22;if(arr[cur]){update();return}}}\ndocument.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('close').onclick=close;viewer.addEventListener('click',e=>{if(e.target===viewer)close()});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});\ninput.addEventListener('change',e=>{arr.forEach((u,i)=>{if(u)URL.revokeObjectURL(u);arr[i]=null});Array.from(e.target.files).filter(f=>f.type.startsWith('image/')).slice(0,22).forEach((f,i)=>arr[i]=URL.createObjectURL(f));draw();input.value=''});draw()})();\n\n// Responsive hamburger navigation\nconst menuToggle=document.getElementById('menuToggle'),menuPanel=document.getElementById('menuPanel');\nif(menuToggle&&menuPanel){menuToggle.addEventListener('click',()=>{const open=menuPanel.classList.toggle('open');menuToggle.setAttribute('aria-expanded',String(open));menuToggle.textContent=open?'×':'☰'});menuPanel.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menuPanel.classList.remove('open');menuToggle.setAttribute('aria-expanded','false');menuToggle.textContent='☰'}));}\n// Search across visible page text; filters matching sections/cards and scrolls to the first match.\nconst search=document.getElementById('siteSearch');\nif(search){search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();document.querySelectorAll('main section, .feature-card, .tile').forEach(el=>{el.classList.remove('search-hidden','search-hit');if(q&&!el.textContent.toLowerCase().includes(q))el.classList.add('search-hidden')});if(q){const hit=document.querySelector('main section:not(.search-hidden),.feature-card:not(.search-hidden),.tile:not(.search-hidden)');if(hit)hit.classList.add('search-hit')} });search.addEventListener('keydown',e=>{if(e.key==='Escape'){search.value='';search.dispatchEvent(new Event('input'))}});}\n// Tabs\ndocument.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===btn)));document.querySelectorAll('[role=tabpanel]').forEach(p=>p.hidden=p.id!==btn.dataset.tab)}));\n// Local-only comments\nconst form=document.getElementById('commentForm'),list=document.getElementById('commentList');\nif(form&&list){const key='ebaad-portfolio-comments-v1';let entries=[];try{entries=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){entries=[]}function renderComments(){list.innerHTML='';entries.slice(-12).reverse().forEach(item=>{const card=document.createElement('article');card.className='comment-item';const name=document.createElement('b');name.textContent=item.name+(item.topic?' · '+item.topic:'');const body=document.createElement('p');body.textContent=item.text;card.append(name,body);list.append(card)})}renderComments();form.addEventListener('submit',e=>{e.preventDefault();entries.push({name:document.getElementById('commentName').value.trim(),topic:document.getElementById('commentTopic').value.trim(),text:document.getElementById('commentText').value.trim()});localStorage.setItem(key,JSON.stringify(entries));form.reset();renderComments()})}\n// Photography carousel\nconst slides=[['Light & shadow','How contrast and direction of light change the feeling of a frame.'],['Colour','Notice how a small palette can give an image a consistent mood.'],['Perspective','Change your position and discover a different composition.'],['Details','Textures and small everyday details can become the main subject.']];\nlet slideIndex=0;function showSlide(){const t=document.getElementById('slideTitle'),d=document.getElementById('slideText'),c=document.getElementById('slideCount');if(t&&d&&c){t.textContent=slides[slideIndex][0];d.textContent=slides[slideIndex][1];c.textContent=String(slideIndex+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0')}}const cp=document.getElementById('carouselPrev'),cn=document.getElementById('carouselNext');if(cp&&cn){cp.onclick=()=>{slideIndex=(slideIndex+slides.length-1)%slides.length;showSlide()};cn.onclick=()=>{slideIndex=(slideIndex+1)%slides.length;showSlide()};showSlide()}\n// Brief page loader\nconst loader=document.createElement('div');loader.className='loader-screen';loader.setAttribute('aria-label','Loading portfolio');loader.innerHTML='<div class=\"loader-mark\" role=\"status\" aria-label=\"Loading\"><\/div>';document.body.append(loader);window.addEventListener('load',()=>setTimeout(()=>loader.classList.add('done'),220));setTimeout(()=>loader.classList.add('done'),1200);\n\n\n// Scroll reveal for section content; respects reduced-motion preferences.\nif(!window.matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window){\n  document.documentElement.classList.add('motion-ready');\n  const motionTargets=document.querySelectorAll('main > section .sectionhead,main > section .panel,main > section .project-card,main > section .feature-card,main > .feature-band .sectionhead,main > .feature-band .feature-card,main > .feature-band .accordion,main > .feature-band .tabbar,main > .feature-band .tab-panel,main > .feature-band .carousel,main > .feature-band #comments');\n  const motionObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{\n    if(entry.isIntersecting){entry.target.classList.add('in-view');motionObserver.unobserve(entry.target)}\n  }),{threshold:.12,rootMargin:'0px 0px -5% 0px'});\n  motionTargets.forEach(el=>motionObserver.observe(el));\n}\n\n<\/script>\n<script>\n(function () {\n  function sendHeight() {\n    const root = document.documentElement;\n    const body = document.body;\n    const height = Math.max(\n      root ? root.scrollHeight : 0,\n      body ? body.scrollHeight : 0\n    );\n    parent.postMessage({ type: 'portfolio-resize', height: Math.ceil(height) }, '*');\n  }\n  window.addEventListener('load', function () {\n    sendHeight();\n    setTimeout(sendHeight, 250);\n    setTimeout(sendHeight, 900);\n  });\n  window.addEventListener('resize', sendHeight);\n  if ('ResizeObserver' in window) {\n    const observer = new ResizeObserver(() => requestAnimationFrame(sendHeight));\n    observer.observe(document.documentElement);\n    observer.observe(document.body);\n  }\n  document.fonts && document.fonts.ready.then(sendHeight);\n  document.addEventListener('click', function (event) {\n    const link = event.target.closest('a[href]');\n    if (!link) return;\n    const href = link.getAttribute('href') || '';\n    let destination;\n    try { destination = new URL(href, 'https://portfolio.local/'); } catch (_) { return; }\n    const file = destination.pathname.split('/').pop().toLowerCase();\n    const targetPage = file === 'academics.html' ? 'academics' :\n                       file === 'photography.html' ? 'photography' : null;\n    if (targetPage) {\n      event.preventDefault();\n      parent.postMessage({\n        type: 'portfolio-page',\n        page: targetPage,\n        hash: destination.hash || ''\n      }, '*');\n    }\n  });\n})();\n<\/script>\n\n<\/body><\/html>"
  };
  let currentPage = 'academics';
  let navigationId = 0;
  const pageLoader = document.getElementById('page-loader');
  let loaderTimer;
  let revealTimer;

  function showLoader() {
    clearTimeout(loaderTimer);
    pageLoader.classList.remove('hidden');
  }
  function hideLoader(id) {
    if (id !== undefined && id !== navigationId) return;
    clearTimeout(loaderTimer);
    clearTimeout(revealTimer);
    pageLoader.classList.add('hidden');
  }
  function navigateTo(page, hash) {
    if (!Object.prototype.hasOwnProperty.call(pages, page)) return;
    if (page === currentPage) {
      if (hash) {
        try { frame.contentWindow.location.hash = hash; } catch (_) {}
      }
      return;
    }
    const id = ++navigationId;
    showLoader();
    currentPage = page;
    frame.onload = function () {
      if (hash) {
        try { frame.contentWindow.location.hash = hash; } catch (_) {}
      }
      requestAnimationFrame(() => {
        try {
          const doc = frame.contentDocument;
          const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
          frame.style.height = Math.max(1, Math.ceil(h)) + 'px';
        } catch (_) {}
        hideLoader(id);
      });
      frame.onload = null;
    };
    frame.srcdoc = pages[page];
    // Failsafe: a delayed font/image must never leave the full-screen loader stuck.
    loaderTimer = setTimeout(() => hideLoader(id), 2200);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  showLoader();
  const initialId = navigationId;
  frame.onload = function () {
    try {
      const doc = frame.contentDocument;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      frame.style.height = Math.max(1, Math.ceil(h)) + 'px';
    } catch (_) {}
    hideLoader(initialId);
    frame.onload = null;
  };
  frame.srcdoc = pages.academics;
  loaderTimer = setTimeout(() => hideLoader(initialId), 2200);

  window.addEventListener('message', function (event) {
    if (event.source !== frame.contentWindow || !event.data) return;
    if (event.data.type === 'portfolio-page') {
      navigateTo(event.data.page, event.data.hash || '');
    } else if (event.data.type === 'portfolio-resize' &&
               Number.isFinite(event.data.height)) {
      frame.style.height = Math.max(1, Math.ceil(event.data.height)) + 'px';
    }
  });

  window.addEventListener('resize', function () {
    try {
      const doc = frame.contentDocument;
      frame.style.height = Math.max(1, Math.ceil(
        Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight)
      )) + 'px';
    } catch (_) {}
  });
})();
